name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Before the ffmpeg install, so a typo fails in seconds rather than after
      # a Homebrew download. `zsh -n a b c` only parses the first argument and
      # treats the rest as positional parameters, so each file needs its own run.
      - name: Syntax check
        run: |
          for f in bin/decant tests/run.sh install.sh; do
            zsh -n "$f"
            echo "ok: $f"
          done

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run test suite
        run: zsh ./tests/run.sh
